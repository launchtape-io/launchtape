[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "launchtape"
dynamic = ["version"]
description = "Load Launch Tape's daily Solana launch data (pump.fun graduations and launches, other launchpads, Meteora pools) in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Launch Tape", email = "launchio48@gmail.com" }]
keywords = ["solana", "pump.fun", "pumpswap", "meteora", "raydium", "dataset", "market data", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["requests>=2.20"]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://launchtape.io"
Datasets = "https://launchtape.io/#datasets"
Pricing = "https://launchtape.io/#buy"
"Data licence" = "https://launchtape.io/#licence"

[project.scripts]
launchtape = "launchtape.cli:main"

[tool.hatch.version]
path = "src/launchtape/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/launchtape"]

[tool.hatch.build.targets.sdist]
include = ["src/launchtape", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
